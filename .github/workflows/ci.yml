name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Каталоги живут в репозиториях серверов: страницы собираются из них,
      # поэтому для сборки сайта их надо положить рядом.
      - uses: actions/checkout@v5
        with: { repository: ilyautov/hh-mcp-ru, path: ../hh-mcp-ru }
      - uses: actions/checkout@v5
        with: { repository: ilyautov/vk-mcp-ru, path: ../vk-mcp-ru }
      - uses: actions/checkout@v5
        with: { repository: ilyautov/diadoc-mcp-ru, path: ../diadoc-mcp-ru }
      - uses: actions/checkout@v5
        with: { repository: ilyautov/sbis-mcp-ru, path: ../sbis-mcp-ru }
      - uses: actions/checkout@v5
        with: { repository: ilyautov/chestny-znak-mcp-ru, path: ../chestny-znak-mcp-ru }
      - run: pip install pytest "pyyaml>=6.0,<7"
      - run: python -m pytest tests/ -q
      - name: Страницы совпадают с каталогами
        run: python scripts/build_pages.py --check
