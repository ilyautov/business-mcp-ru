name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest tests/ -q
      - name: Каждый сервер поднимается и отдаёт инструменты
        run: |
          for s in hh vk diadoc sbis crpt; do
            python -c "
import asyncio, importlib
m = importlib.import_module(f'${s}_mcp.server')
tools = asyncio.run(m.mcp.list_tools())
assert tools, 'нет инструментов'
print(f'${s}: {len(tools)} инструментов')
"
          done
