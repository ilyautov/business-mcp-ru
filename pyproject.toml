[project]
name = "business-mcp-ru"
version = "0.1.0"
description = "Пять MCP-серверов для российских деловых сервисов: hh.ru, VK, Диадок, СБИС, Честный знак"
keywords = ["mcp", "model-context-protocol", "russia", "hh", "vk", "diadoc", "sbis", "chestny-znak", "claude"]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Ilya Utov" }]
# Кода здесь нет намеренно: пакет существует, чтобы поставить пять серверов
# одной строкой. Каждый из них ставится и отдельно.
dependencies = [
    "hh-mcp-ru>=0.1,<1",
    "vk-mcp-ru>=0.1,<1",
    "diadoc-mcp-ru>=0.1,<1",
    "sbis-mcp-ru>=0.1,<1",
    "chestny-znak-mcp-ru>=0.1,<1",
]

[project.urls]
Homepage = "https://business-mcp-ru.aifrontier.tech/"
Repository = "https://github.com/ilyautov/business-mcp-ru"
Issues = "https://github.com/ilyautov/business-mcp-ru/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyyaml>=6.0,<7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
